name: Sprunki Autopilot

# Har kuni o'zi video yasab, YouTube'ga yuklaydi.
# Qo'lda ishga tushirish: GitHub -> Actions -> Sprunki Autopilot -> Run workflow
on:
  schedule:
    - cron: "23 14 * * *" # har kuni 14:23 UTC (Toshkent vaqti 19:23)
  workflow_dispatch:
    inputs:
      crew:
        description: "Nechta Coree Crew Short (ovozsiz, OpenAI kerak emas)"
        default: "2"
      shorts:
        description: "Nechta ovozli Short (OpenAI kerak)"
        default: "1"
      long:
        description: "Nechta uzun video"
        default: "0"
      minutes:
        description: "Uzun video necha daqiqa"
        default: "8"
      privacy:
        description: "private / unlisted / public"
        default: "private"

permissions:
  contents: write # data/history.json ni saqlash uchun

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Kutubxonalar
        run: npm ci

      - name: Kalitlar borligini tekshirish
        id: secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          if [ -z "$YT_TOKEN_JSON" ]; then
            echo "::warning::YT_TOKEN_JSON secret'i qo'shilmagan. README 4-bo'limiga qarang. Video yasalmadi."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Video yasash va yuklash
        if: steps.secrets.outputs.ready == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          MADE_FOR_KIDS: ${{ vars.MADE_FOR_KIDS }}
        run: >
          npm run auto --
          --crew "${{ inputs.crew || '2' }}"
          --shorts "${{ inputs.shorts || '1' }}"
          --long "${{ inputs.long || '0' }}"
          --minutes "${{ inputs.minutes || '8' }}"
          --privacy "${{ inputs.privacy || vars.YT_PRIVACY || 'private' }}"

      - name: Tayyor videolarni saqlash (3 kun)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: |
            output/**/video.mp4
            output/**/thumbnail.jpg
            output/**/script.json
            output/**/props.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Tarixni saqlash (mavzular takrorlanmasligi uchun)
        if: always()
        run: |
          git config user.name "sprunki-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "autopilot: update history"
          for i in 1 2 3; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "::warning::Tarixni saqlab bo'lmadi"
